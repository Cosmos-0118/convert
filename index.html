<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
  <title>Convert to it!</title>
  
  <meta name="url" content="https://convert.to.it">
  <meta name="identifier-URL" content="https://convert.to.it">
  <meta name="og:url" content="https://convert.to.it"/>
  <meta name="og:title" content="Convert to it!"/>
  <meta name="og:site_name" content="Convert to it!"/>
  <meta name="og:description" content="Truly universal online file converter. Private, on-device conversion across mediums."/>
  <meta name="og:image" content="https://p2r3.github.io/convert/assets/favicon-Bfod-rsk.ico"/>
  <meta name="theme-color" content="#0f172a"/>
  <meta name="og:type" content="website"/>
</head>
<body>

  <div class="background-container">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="grid-overlay"></div>
  </div>

  <nav class="navbar">
    <div class="nav-brand">
      <i data-lucide="zap" class="brand-icon"></i>
      <span class="brand-text">Convert<span class="brand-highlight">.to.it</span></span>
    </div>
    <div class="nav-controls">
      <div class="theme-wrapper">
        <i data-lucide="palette" class="theme-icon"></i>
        <select id="theme-switcher">
          <option value="dark">Dark</option>
          <option value="light">Light</option>
          <option value="black-red">Crimson</option>
        </select>
      </div>
      <button id="mode-button" class="btn-ghost" title="Toggle Advanced Mode">
        <i data-lucide="settings"></i>
        <span>Basic</span>
      </button>
      <a id="commit-id" href="https://github.com/p2r3/convert" target="_blank" class="commit-link">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-github"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"/><path d="M9 18c-4.51 2-5-2-7-2"/></svg>
        <span class="commit-text"></span>
      </a>
    </div>
  </nav>

  <main class="main-content">
    <header class="hero">
      <div class="badge">
        <i data-lucide="shield-check"></i>
        <span>100% Private, On-Device</span>
      </div>
      <h1 class="hero-title">The <span class="gradient-text">Universal</span> File Converter</h1>
      <p class="hero-subtitle">Convert between thousands of formats right in your browser. No data leaves your device.</p>
    </header>

    <div class="converter-card">
      <input id="file-input" type="file" multiple>
      
      <div id="file-area" class="upload-zone">
        <div class="upload-icon-wrapper">
          <i data-lucide="upload-cloud"></i>
        </div>
        <div class="upload-text">
          <h2 id="upload-title">Click to add your files</h2>
          <p id="drop-hint-text">or drag and drop them here</p>
        </div>
      </div>
      
      <div id="format-containers" class="format-selectors" style="display: none;">
        <div id="from-container" class="format-container">
          <div class="format-header">
            <h3>Convert from</h3>
            <div class="search-box">
              <i data-lucide="search"></i>
              <input type="text" id="search-from" class="search" placeholder="Search format...">
            </div>
          </div>
          <div class="format-list-wrapper">
            <div id="from-list" class="format-list"></div>
          </div>
        </div>
        
        <div class="format-divider">
          <div class="divider-icon-wrapper">
            <i data-lucide="arrow-right"></i>
          </div>
        </div>

        <div id="to-container" class="format-container">
          <div class="format-header">
            <h3>Convert to</h3>
            <div class="search-box">
              <i data-lucide="search"></i>
              <input type="text" id="search-to" class="search" placeholder="Search format...">
            </div>
          </div>
          <div class="format-list-wrapper">
            <div id="to-list" class="format-list"></div>
          </div>
        </div>
      </div>

      <div class="action-area">
        <button id="convert-button" class="btn-primary disabled">
          <span class="btn-text">Convert Now</span>
          <i data-lucide="arrow-right" class="btn-icon"></i>
        </button>
      </div>
    </div>
  </main>

  <div id="popup-bg"></div>
  <div id="popup">
    <div class="modal-content">
      <div class="spinner"></div>
      <h2>Loading tools...</h2>
    </div>
  </div>

  <script type="module" src="src/app/main.ts"></script>
</body>
</html>
